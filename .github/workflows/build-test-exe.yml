name: Build Test EXE

on:
  push:
    branches:
      - release-0.66.0-timeout-fix
  pull_request:
    branches:
      - release-0.66.0-timeout-fix
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Publish BetterGI
        run: dotnet publish BetterGenshinImpact/BetterGenshinImpact.csproj -c Release -p:PublishProfile=FolderProfile
      - uses: actions/upload-artifact@v4
        with:
          name: BetterGI.exe
          path: BetterGenshinImpact/bin/x64/Release/net8.0-windows10.0.22621.0/publish/win-x64/BetterGI.exe
          if-no-files-found: error
